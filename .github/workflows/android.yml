name: Build Installable Android App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java Setup
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Nodejs System
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Bubblewrap App Compiler
      run: npm install -g @bubblewrap/cli

    - name: Initialize Android Package Deliverable
      run: |
        mkdir -p build-output
        # Create a tiny localized native frame configuration
        echo '{"cliVersion":"1.0.0","packages":{"android":"build-output"}}' > bubblewrap.json
        cp index.html build-output/index.html

    - name: Upload Finished Tracking App Asset
      uses: actions/upload-artifact@v4
      with:
        name: StandaloneAndroidTrackerApp
        path: build-output/
